name: Build Universal Standard IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare App Directory Structure
      run: |
        mkdir -p Payload/SheetMusicApp.app
        mv ContentView.swift Payload/SheetMusicApp.app/
        
        cat << 'EOF' > Payload/SheetMusicApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>SheetMusicApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.test.SheetMusicApp</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>SheetMusicApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
        </dict>
        </plist>
        EOF

    - name: Compile Executable with SwiftC
      run: |
        SDK_PATH=$(xcrun -sdk iphoneos --show-sdk-path)
        xcrun -sdk iphoneos swiftc -parse-as-library \
          Payload/SheetMusicApp.app/ContentView.swift \
          -sdk $SDK_PATH \
          -target arm64-apple-ios15.0 \
          -Xlinker -rpath -Xlinker /System/Library/Frameworks \
          -Xlinker -rpath -Xlinker /usr/lib/swift \
          -o Payload/SheetMusicApp.app/SheetMusicApp
        
        rm Payload/SheetMusicApp.app/ContentView.swift

    - name: Compress into Standard IPA
      run: |
        zip -r SheetMusicApp-Fix.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: SheetMusicApp-Fix-IPA
        path: SheetMusicApp-Fix.ipa
